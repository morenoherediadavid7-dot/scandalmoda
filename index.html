<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCANDALMODA</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{text-align:center;padding:45px 20px;background:linear-gradient(135deg,#111,#2b2430)}
h1{font-family:Georgia,serif;font-size:48px;margin:0 0 8px}.crown{font-size:34px}p{color:#ddd}
section{max-width:1000px;margin:auto;padding:35px 20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#1d1d1d;border-radius:18px;padding:20px;text-align:center}
.placeholder{height:230px;border-radius:14px;background:#333;display:flex;align-items:center;justify-content:center;color:#aaa}
button{background:#fff;color:#111;border:0;border-radius:25px;padding:12px 20px;font-weight:bold}
footer{text-align:center;padding:30px;color:#aaa}
</style>
</head>
<body>
<header><div class="crown">♛</div><h1>SCANDALMODA</h1><p>Ropa · Accesorios · Bisutería</p></header>
<section><h2>Novedades</h2><div class="products">
<div class="card"><div class="placeholder">Tu foto aquí</div><h3>Producto 1</h3><p>Precio: €</p><button>Comprar</button></div>
<div class="card"><div class="placeholder">Tu foto aquí</div><h3>Producto 2</h3><p>Precio: €</p><button>Comprar</button></div>
<div class="card"><div class="placeholder">Tu foto aquí</div><h3>Producto 3</h3><p>Precio: €</p><button>Comprar</button></div>
</div></section>
<footer>© SCANDALMODA</footer>
</body>
</html>
